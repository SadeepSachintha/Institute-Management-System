name: Build Desktop Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, zip, bcmath, sqlite, pdo_sqlite, fileinfo
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install PHP Dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

    - name: Copy Env File
      run: cp .env.example .env

    - name: Generate App Key
      run: php artisan key:generate

    - name: Install JS Dependencies
      run: npm ci

    - name: Compile Frontend Assets
      run: npm run build

    - name: Setup Laravel Storage Link
      run: php artisan storage:link

    - name: Build Standalone Desktop Installer
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      run: php artisan native:build win x64 --no-interaction

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IMS-Core-Windows-Installer
        path: dist/*.exe
