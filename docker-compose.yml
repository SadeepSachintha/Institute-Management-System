version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ims-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - ims-network

  db:
    image: mariadb:10.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ims_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - ims-db-data:/var/lib/mysql
    networks:
      - ims-network

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    image: ims-analytics
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ims_db
      DB_USERNAME: root
      DB_PASSWORD: ""
    depends_on:
      - db
    networks:
      - ims-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ims-network

volumes:
  ims-db-data:

networks:
  ims-network:
    driver: bridge
